name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 3 * * 1'   # weekly, catches anything that slipped in
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history — a rewritten-away secret still lives in old commits

      - name: Scan working tree and history
        run: ./scripts/scan-secrets.sh --history
