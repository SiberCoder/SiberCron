name: CI

on:
  push:
    branches: [main]
  # Every pull request, whatever it targets — a stacked PR based on another
  # branch needs checking just as much as one opened straight against main.
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No version pin here on purpose: pnpm/action-setup fails outright when this
      # disagrees with the packageManager field in package.json. Let it read that.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Lint
        run: pnpm lint
        continue-on-error: true
